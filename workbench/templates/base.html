<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Simulation Alchemist - Researcher Workbench v1.5{% endblock %}</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --border-color: #334155;
            --border-accent: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-sky: #38bdf8;
            --accent-indigo: #818cf8;
            --status-success: #34d399;
            --status-warning: #fbbf24;
            --status-error: #f87171;
            --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Workstation Top Navigation Header */
        .header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-brand h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .version-badge {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-sky);
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            font-family: var(--font-mono);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--status-success);
        }

        /* Main App Grid Layout */
        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            min-height: calc(100vh - 54px);
        }

        /* Sidebar Styling */
        .sidebar {
            background-color: #111827;
            border-right: 1px solid var(--border-color);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .experiment-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .experiment-card:hover {
            border-color: var(--accent-sky);
            background-color: var(--bg-card-hover);
        }

        .experiment-card.active {
            border-color: var(--accent-sky);
            box-shadow: 0 0 0 1px var(--accent-sky);
            background-color: rgba(56, 189, 248, 0.08);
        }

        .exp-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .exp-card-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .exp-tag {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        .exp-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Parameter Form Controls */
        .param-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .param-row {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .param-row label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .param-value-val {
            font-family: var(--font-mono);
            color: var(--accent-sky);
        }

        .param-row input[type="range"] {
            width: 100%;
            accent-color: var(--accent-sky);
        }

        .param-row input[type="number"], .param-row input[type="text"] {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .param-row input:focus {
            outline: none;
            border-color: var(--accent-sky);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background-color: var(--accent-sky);
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: #7dd3fc;
        }

        .btn-secondary {
            background-color: var(--bg-card-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
        }

        .btn-accent {
            background-color: var(--accent-indigo);
            color: #ffffff;
        }

        .btn-accent:hover {
            background-color: #a5b4fc;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Main Content Viewport */
        .main-viewport {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
        }

        /* Data Tables */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .metric-tile {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.65rem 0.85rem;
        }

        .metric-tile .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        .metric-tile .val {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent-sky);
            margin-top: 0.1rem;
        }

        /* Comparison Table */
        .diff-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .diff-table th, .diff-table td {
            padding: 0.6rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .diff-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .diff-positive { color: var(--status-success); }
        .diff-negative { color: var(--status-error); }

        /* Canvas Spatial Viewport */
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 512px;
            height: 384px;
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Time Scrubber Bar */
        .scrubber-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1.25rem;
        }

        .scrubber-slider {
            flex: 1;
            accent-color: var(--accent-sky);
        }

        .step-readout {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-secondary);
            min-width: 90px;
            text-align: right;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="header">
        <div class="header-brand">
            <h1>Simulation Alchemist</h1>
            <span class="version-badge">v1.5 Workstation</span>
        </div>
        <div class="header-status">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="header-status-text">Ready</span>
            </div>
            <div id="header-session-info" style="font-family: var(--font-mono);">
                Session: <span style="color: var(--accent-sky);">None</span>
            </div>
        </div>
    </div>

    <div class="app-container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
