# Field-Guided Movers — experiment parameters (Task 1.1)
#
# Reference defaults; the authoritative configuration is the
# `experiments.field_guided_movers.model.MoversConfig` dataclass (the
# validated baseline uses dataclass configs rather than YAML loading).
#
# Composition: py-pde reaction-diffusion field + Pymunk probe bodies.
# No Mesa engines are involved.

# --- field (py-pde, Schnakenberg) --------------------------------------
n: 32
seed: 0
pde_dt: 5.0e-4
du: 0.005
dv: 0.2
a: 0.1
b: 0.9

# --- clock -------------------------------------------------------------
macro_timestep: 0.2
n_steps: 160

# --- Pymunk mover bodies -----------------------------------------------
n_movers: 6
mover_mass: 1.0
mover_damping: 0.2
mover_radius: 0.05
phys_dt: 0.05
phys_substeps: 4

# --- coupling rules (experiment-owned) ---------------------------------
apply_forces: true       # field gradient -> physical force
apply_sources: true      # mover position -> chemical source/sink
force_fmax: 0.8
force_gsat: 2.0
source_u: 0.03           # activator deposited per macro step
source_v: -0.04          # inhibitor consumed per macro step
source_radius: 0.04