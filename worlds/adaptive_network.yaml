# Adaptive Network Morphogenesis — declarative world definition (Experiment C)
#
# Three-domain triangle: NDlib network diffusion + py-pde field + pymunk walls.
#   network load --> PDE sources --> field pattern --> physical wall growth /
#   movement --> edge weighting / topology changes --> network diffusion (repeat)
#
# This YAML is the declarative twin of the world built by
# `experiments.network_morphogenesis.coupling.build_network_morphogenesis_world`.
# Loading it with `sim_alchemist.core.world.load_world_yaml` produces an
# identical WorldDefinition and composes/runs identically.
#
# The `network` component is supplied by the experiment's coupling layer
# (overriding registry entry on top of the core `default_registry`).  The
# custom network update rule is a weighted-averaging / transport rule over
# continuous node loads, NOT physically calibrated nutrient transport.
#
# See AGENTS.md for the scientific limitations of the model.

id: adaptive_network

components:
  - id: py-pde
    config:
      n: 32
      du: 0.005
      dv: 0.2
      a: 0.1
      b: 0.9
      dt: 5.0e-4
      seed: 0
      field_step: 0.2
  - id: pymunk
    config:
      n: 32
      mass: 1.0
      damping: 0.05
      dt_phys: 0.05
      phys_substeps: 4
  - id: network
    config:
      grid_rows: 4
      grid_cols: 6
      beta: 0.3
      loss: 0.05
      seed: 0

requires:
  - reaction_diffusion
  - rigid_body
  - network_diffusion
  - field_gradient

schedule:
  - geometry.sync
  - field.step
  - physics.force
  - physics.step
  - physics.grow
  - network.step
  - network.route
  - field.source
  - observables.record

macro_timestep: 0.2
max_steps: 160
seed: 0

config:
  n: 32
  seed: 0
  pde_dt: 5.0e-4
  du: 0.005
  dv: 0.2
  a: 0.1
  b: 0.9
  field_step: 0.2
  n_steps: 160
  mass: 1.0
  wall_damping: 0.05
  phys_dt: 0.05
  phys_substeps: 4
  grid_rows: 4
  grid_cols: 6
  network_beta: 0.3
  network_loss: 0.05
  force_fmax: 0.8
  force_gsat: 2.0
  source_amplitude: 0.01
  source_radius: 0.08
  wall_radius: 0.02
  wall_mass: 1.0