# Chemo-mechanical Morphogenesis — declarative world definition (Experiment A)
#
# This YAML is the declarative twin of the programmatic world built by
# `chemomech.coupling.build_morphogenesis_world`.  Loading it with
# `sim_alchemist.core.world.load_world_yaml` produces an identical
# WorldDefinition, so a YAML world composes and runs exactly like the
# programmatic one (validated bitwise in tests).
#
# Components are resolved through the core `default_registry` (mesa / py-pde /
# pymunk wall variant); `requires` are the world-level capabilities the
# composition must demonstrate; `schedule` is the declared macro-step order
# resolved against the experiment's coupling-operations registry at compose
# time.
#
# See AGENTS.md for the scientific limitations of the model.

id: chemo_morphogenesis

components:
  - id: py-pde
    config:
      n: 32
      du: 0.005
      dv: 0.2
      a: 0.1
      b: 0.9
      dt: 5.0e-4
      seed: 0
      field_step: 0.2
  - id: pymunk
    config:
      n: 32
      mass: 1.0
      damping: 0.05
      dt_phys: 0.05
      phys_substeps: 4
  - id: mesa
    config:
      agent_configs:
        - x: 0.3
          y: 0.5
          build_threshold: 0.15
          wall_length: 0.35
          wall_radius: 0.02
          wall_offset: 0.2
          min_separation: 0.15
          cooldown: 4
          dissolve_threshold: 0.05
          dissolve_min_age: 2.5
        - x: 0.7
          y: 0.5
          build_threshold: 0.15
          wall_length: 0.35
          wall_radius: 0.02
          wall_offset: 0.2
          min_separation: 0.15
          cooldown: 4
          dissolve_threshold: 0.05
          dissolve_min_age: 2.5
      seed: 0
      macro_timestep: 0.2

requires:
  - agent_population
  - reaction_diffusion
  - rigid_body
  - field_gradient

schedule:
  - geometry.sync
  - field.step
  - physics.force
  - physics.step
  - agents.step
  - agents.apply
  - observables.record

macro_timestep: 0.2
max_steps: 160
seed: 0

config:
  n: 32
  seed: 0
  pde_dt: 5.0e-4
  du: 0.005
  dv: 0.2
  a: 0.1
  b: 0.9
  field_step: 0.2
  n_steps: 160
  feedback: true
  build_walls: true
  apply_forces: true
  force_fmax: 0.8
  force_gsat: 2.0
  wall_mass: 1.0
  wall_damping: 0.05
  phys_dt: 0.05
  phys_substeps: 4