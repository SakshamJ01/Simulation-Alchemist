[project]
name = "simulation-alchemist"
version = "0.1.0"
description = "Baseline v0.1 of Simulation Alchemist: the validated chemo-mechanical prototype (Task 0.3 audit)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib==3.11.1",
    "mesa==3.5.1",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "py-pde==0.58.0",
    "pymunk==7.3.0",
]

[dependency-groups]
dev = [
    "hypothesis",
    "pyright",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5.:DeprecationWarning:pde\\.fields\\.base",
]